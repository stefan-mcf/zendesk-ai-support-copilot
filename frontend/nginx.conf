server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Resolve the Compose-only API hostname at request time so this same image
    # can start in AWS, where the ALB routes /v1 directly to the API service.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

  location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
  }

  location /v1/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
        try_files $uri $uri/ /index.html;
    }
}
