name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: make backend
      - run: make evaluate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make frontend

  zendesk-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zendesk-app/package-lock.json
      - run: npm ci
        working-directory: zendesk-app
      - run: make zendesk-app

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - run: docker compose config --quiet
      - run: terraform -chdir=deploy/aws init -backend=false
      - run: terraform -chdir=deploy/aws fmt -check
      - run: terraform -chdir=deploy/aws validate
