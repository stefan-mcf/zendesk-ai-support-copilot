[project]
name = "sm-systems-ai-support-copilot"
version = "0.1.0"
description = "Grounded, human-reviewed Zendesk AI support operations system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "prometheus-client>=0.22,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1",
  "pgvector>=0.4,<1",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
  "boto3>=1.40,<2",
]

[project.scripts]
copilot-evaluate = "copilot.cli:main"

[dependency-groups]
dev = [
  "boto3-stubs[bedrock-runtime]>=1.40,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["copilot"]
plugins = ["pydantic.mypy"]
